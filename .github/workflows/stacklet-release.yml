name: "Stacklet Release"

on:
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  CA_DOMAIN: stacklet
  CA_OWNER: "653993915282"
  CA_REPO: stacklet.c7n
  DEFAULT_PY_VERSION: "3.12"
  UV_VERSION: "0.11.13"

permissions: {}

jobs:
  Publish:
    runs-on: ubuntu-latest
    environment: stacklet-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # actions/checkout@v4
        with:
          persist-credentials: false

      # This repo only ever ships prereleases stamped with a +HASH local
      # version segment (…aN+HASH, or …aN.postM+HASH for a hotfix on a
      # release branch). A version without both is a misconfiguration
      # — fail loudly before building or publishing anything.
      - name: Assert prerelease version
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [[ ! "$version" =~ a[0-9]+(\.post[0-9]+)?[+][0-9a-zA-Z.]+$ ]]; then
            echo "::error::cloud-custodian-prerelease must ship a stamped prerelease version (…aN+HASH or …aN.postM+HASH); got '$version'"
            exit 1
          fi
          echo "Releasing prerelease version $version"

      - name: Install Custodian
        uses: ./.github/composites/install
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.DEFAULT_PY_VERSION }}

      - name: Build Wheels
        shell: bash
        run: |
          make pkg-build-wheel

      - name: Check release wheels
        shell: bash
        run: |
          uv run tools/dev/check_release_wheels.py dist

      # Build docs before publishing wheels: `make sphinx` builds with -W
      # (warnings as errors), so a docs failure aborts the release before the
      # wheels are irrevocably published.
      - name: Build Docs
        shell: bash
        run: |
          make sphinx

      - uses: aws-actions/configure-aws-credentials@9c6d2df54d423438f318f9e952c3a05345c1ac36 # aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.STACKLET_PUBLISH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish Wheels
        shell: bash
        env:
          UV_KEYRING_PROVIDER: subprocess
          UV_PUBLISH_USERNAME: aws
        run: |
          set -euo pipefail
          uv pip install keyrings.codeartifact==2.1.2
          repo_url=$(aws codeartifact get-repository-endpoint \
            --domain "$CA_DOMAIN" \
            --domain-owner "$CA_OWNER" \
            --repository "$CA_REPO" \
            --format pypi \
            --query repositoryEndpoint \
            --output text)
          uv publish --publish-url "$repo_url" dist/*

      - name: Publish Docs
        shell: bash
        env:
          C7N_DOCS_BUCKET: stacklet-c7n-prerelease-docs
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          tar -czf /tmp/c7n-docs.tar.gz -C docs/build/html .
          aws s3 cp /tmp/c7n-docs.tar.gz \
            "s3://${C7N_DOCS_BUCKET}/${version}.tar.gz"
